name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public files only
        run: |
          mkdir -p _site
          cp *.html favicon.ico site.webmanifest robots.txt sitemap.xml humans.txt CNAME _site/
          if [ -f pgp.asc ]; then cp pgp.asc _site/; fi
          cp -r assets listings _site/
          rm -f _site/listings/.gitkeep
          if [ -f vault.json ]; then cp vault.json _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
